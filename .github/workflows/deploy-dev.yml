name: Deploy to Dev

on:
  workflow_run:
    workflows: ["CI — Tests & Build"]
    types: [completed]
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 (dev)
        run: |
          rsync -avz --delete \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude='server/db/*.db*' \
            --exclude=dist-electron \
            --exclude=.claude \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/opt/mf-dashboard-dev/

      - name: Restart dev server
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "
            cd /opt/mf-dashboard-dev &&
            npm ci --omit=dev --ignore-scripts &&
            npm rebuild better-sqlite3 &&
            pm2 restart mf-api-dev || pm2 start server/index.js --name mf-api-dev --node-args='--env-file=.env'
          "
